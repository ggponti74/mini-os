name: mini-os CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build ISO and smoke-test boot
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            binutils \
            grub-pc-bin \
            gcc-multilib \
            grub-common \
            xorriso \
            mtools \
            qemu-system \
            qemu-system-x86 \
            file

      - name: Show tool versions
        run: |
          nasm --version
          ld --version | head -n 1
          grub-mkrescue --version
          qemu-system-i386 --version | head -n 1

      - name: Build bootable ISO
        run: make iso

      - name: Verify disk image
        run: |
          test -s dist/mini-os.img
          file dist/mini-os.img
          ls -lh dist/

#      - name: Smoke-test QEMU boot
#        run: mqemu-system-x86_64 -enable-kvm -m 2G -cdrom ./iso/mini-os.iso -nographic -serial stdio

      - name: Upload ISO and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mini-os-${{ github.sha }}
          path: |
            dist/*.iso
            build/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-os.iso          # Name of the downloaded zip file
          path: dist/mini-os.iso     # Path to the file or directory to upload
          retention-days: 5          # Optional: Duration to keep the artifact